[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "initials-agent"
version = "0.1.0"
description = "Daily Content Agent — sellable multi-brand LinkedIn/Instagram content product (BYOK)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27.0",
    "tenacity>=8.0.0",
    "pillow>=10.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2023.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
saas = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
initials-agent = "initials_agent.__main__:main"
